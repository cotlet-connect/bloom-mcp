[project]
name = "bloom-cotlet-mcp"
version = "1.1.0"
description = "Connect Bloom to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Bloom API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["bloom", "bloom api", "bloom mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/bloom-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=bloom"
Source = "https://github.com/cotlet-connect/bloom-mcp"

[project.scripts]
bloom-cotlet-mcp = "bloom_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"bloom_agent.py" = "bloom_agent.py"

[tool.hatch.build.targets.sdist]
include = ["bloom_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
